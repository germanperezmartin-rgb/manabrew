name: Arcana Arena - Forge WebAssembly desde el codigo fuente

on:
  push:
    branches:
      - arcana/forge-source-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir Forge Java y Arcana web
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
      - name: Preparar Yarn
        run: npm install --global yarn
      - name: Preparar Rust WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: arcana-forge-webimage
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - name: Dependencias JavaScript
        run: yarn install --frozen-lockfile
      - name: Herramientas Oracle GraalVM Web Image y Binaryen
        uses: actions/cache@v4
        id: webimage-tools
        with:
          path: ~/.local/webimage
          key: arcana-graalvm-jdk-25i3-25.0.4.1-ea.03-binaryen-123
      - name: Descargar compilador Web Image real
        if: steps.webimage-tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/webimage"
          cd "$HOME/.local/webimage"
          curl --fail --location --show-error --retry 3 -o graalvm.tar.gz \
            "https://github.com/graalvm/oracle-graalvm-ea-builds/releases/download/jdk-25i3-25.0.4.1-ea.03/graalvm-jdk-25i3-25.0.4.1-ea.03_linux-x64_bin.tar.gz"
          tar -xzf graalvm.tar.gz
          rm graalvm.tar.gz
          curl --fail --location --show-error --retry 3 -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz"
          tar -xzf binaryen.tar.gz
          rm binaryen.tar.gz
      - name: Compilar el Forge Java autentico a WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/webimage/binaryen-version_123/bin:$PATH"
          export WEBIMAGE_GRAALVM_HOME="$(echo "$HOME"/.local/webimage/graalvm-*)"
          echo "Compilador Web Image: $WEBIMAGE_GRAALVM_HOME"
          yarn build:forge-wasm
          test -s packages/forge-wasm/forgeharness.js
          test -s packages/forge-wasm/forgeharness.js.wasm
          ls -lh packages/forge-wasm/forgeharness.js*
      - name: Construir motor Rust, cartas y ediciones
        run: yarn build:wasm
      - name: Traducir y verificar TypeScript
        run: |
          yarn i18n:compile
          yarn typecheck
      - name: Crear cliente web jugable
        run: yarn vite:build
      - name: Adjuntar compilacion web con Forge
        uses: actions/upload-artifact@v4
        with:
          name: arcana-web-forge-completo
          path: dist/
          if-no-files-found: error
          retention-days: 30

  game-test:
    name: Probar un duelo real contra IA
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
      - name: Instalar dependencias y Chromium
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Recuperar web con Forge compilado
        uses: actions/download-artifact@v4
        with:
          name: arcana-web-forge-completo
          path: arcana-dist
      - name: Servidor web aislado
        run: |
          cat > /tmp/arcana-serve.py <<'PY'
          import os
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          os.chdir("arcana-dist")
          class IsolatedHandler(SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header("Cross-Origin-Opener-Policy", "same-origin")
                  self.send_header("Cross-Origin-Embedder-Policy", "require-corp")
                  super().end_headers()
          ThreadingHTTPServer(("127.0.0.1", 4173), IsolatedHandler).serve_forever()
          PY
          nohup python3 /tmp/arcana-serve.py > /tmp/arcana-server.log 2>&1 &
          sleep 3
          curl -fI http://127.0.0.1:4173/
      - name: Iniciar partida Forge contra IA
        run: node scripts/arcana-game-smoke.mjs
      - name: Adjuntar capturas y resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcana-partida-forge-validacion
          path: |
            arcana-selector.png
            arcana-mazos-seleccionados.png
            arcana-inicio-partida.png
            arcana-fallo-partida.png
            arcana-tablero.png
            arcana-partida.json
          if-no-files-found: warn
          retention-days: 30
