name: Arcana Arena - Probar una partida contra IA

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/arcana-game-smoke.yml
      - scripts/arcana-game-smoke.mjs
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  forge-game:
    name: Abrir una partida contra Forge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
      - name: Instalar dependencias
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Preparar Chromium
        run: npx playwright install --with-deps chromium
      - name: Recuperar compilacion web verificada
        uses: actions/download-artifact@v4
        with:
          name: arcana-web-compilado
          path: arcana-dist
          run-id: 41351753911
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Iniciar cliente Arcana con aislamiento
        run: |
          cat > /tmp/arcana-serve.py <<'PY'
          import os
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          os.chdir("arcana-dist")
          class IsolatedHandler(SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header("Cross-Origin-Opener-Policy", "same-origin")
                  self.send_header("Cross-Origin-Embedder-Policy", "require-corp")
                  super().end_headers()
          ThreadingHTTPServer(("127.0.0.1", 4173), IsolatedHandler).serve_forever()
          PY
          nohup python3 /tmp/arcana-serve.py > /tmp/arcana-server.log 2>&1 &
          sleep 3
          curl -fI http://127.0.0.1:4173/
      - name: Empezar combate contra IA
        run: node scripts/arcana-game-smoke.mjs
      - name: Adjuntar capturas y errores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcana-prueba-partida
          path: |
            arcana-selector.png
            arcana-inicio-partida.png
            arcana-tablero.png
            arcana-mazos-seleccionados.png
            arcana-fallo-partida.png
            arcana-partida.json
          if-no-files-found: warn
          retention-days: 30
