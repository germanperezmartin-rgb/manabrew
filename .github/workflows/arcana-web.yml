name: Arcana Arena - Compilar navegador

on:
  push:
    branches:
      - arcana/espanol-hechizos-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Verificar y compilar Arcana web
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
      - name: Yarn 1
        run: npm install --global yarn
      - name: Rust con WebAssembly
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Enlazador
        uses: rui314/setup-mold@v1
      - name: Cache de Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: arcana-web
      - name: wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - name: Instalar dependencias
        run: yarn install --frozen-lockfile
      - name: Probar supervisor de Forge
        run: yarn test:forge-supervisor
      - name: Compilar traducciones
        run: yarn i18n:compile
      - name: Construir motor WebAssembly y datos de cartas
        run: yarn build:wasm
      - name: Verificar TypeScript y compilar interfaz
        run: yarn vite:build
      - name: Publicar artefacto web
        uses: actions/upload-artifact@v4
        with:
          name: arcana-web-compilado
          path: dist/
          if-no-files-found: error
          retention-days: 30
