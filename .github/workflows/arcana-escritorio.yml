name: Arcana Arena - Instalar en Windows

on:
  push:
    branches:
      - arcana/solo-escritorio
      - arcana/importador-scryfall-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Arcana Arena para Windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
      - run: npm install --global yarn
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: arcana-windows
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - name: Instalar dependencias
        run: yarn install --frozen-lockfile
      - name: Compilar traducciones
        run: yarn i18n:compile
      - name: Motor WebAssembly y cartas
        run: yarn build:wasm
      - name: Comprobar interfaz TypeScript
        run: yarn vite:build
      - name: Compilar motor Java Forge
        run: yarn ensure:harness
      - name: Compilar biblioteca nativa Forge
        shell: pwsh
        run: ./forge-harness/build-native.ps1
      - name: Probar biblioteca nativa
        run: cargo run -p self-hosted-node --features graal-forge
        env:
          SELF_HOSTED_NODE_GRAAL_SMOKE: "1"
      - name: Generar instalador Windows sin firma
        run: yarn tauri build --features forge-room --config src-tauri/arcana.conf.json
      - name: Verificar instalador real y DLL de Forge junto al ejecutable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem "target/release/bundle/nsis" -Filter "*setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "No existe el instalador .exe de Windows" }
          $tool = Get-Command 7z -ErrorAction SilentlyContinue
          if (-not $tool) { throw "7-Zip no esta disponible en el ejecutor Windows" }
          $target = Join-Path $env:RUNNER_TEMP "arcana-nsis-verificacion"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          & 7z x "-o$target" -y "$($installer.FullName)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "No se pudo extraer el instalador NSIS" }
          $app = Get-ChildItem $target -File -Recurse -Filter "Arcana Arena.exe" | Select-Object -First 1
          if (-not $app) { throw "El instalador no contiene Arcana Arena.exe" }
          $dll = Join-Path $app.DirectoryName "forgeharness.dll"
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
            Get-ChildItem $target -Recurse -Filter "forgeharness.dll" |
              ForEach-Object { Write-Host "DLL mal situada: $($_.FullName)" }
            throw "FORGEHARNES FALTA AL LADO DE Arcana Arena.exe: no publicar instalador"
          }
          $dllFile = Get-Item -LiteralPath $dll
          if ($dllFile.Length -lt 1MB) {
            throw "La DLL de Forge esta vacia o incompleta: $($dllFile.Length) bytes"
          }
          Write-Host "OK: Arcana Arena.exe y forgeharness.dll en el mismo directorio, DLL $($dllFile.Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: arcana-windows-instalador-sin-firma
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
